services:
  - type: web
    name: colegio-darcan-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ENABLE_DEFAULT_ADMINS
        value: false
      - key: APP_ENABLE_DEMO_SEED
        value: false
      - key: STATE_CACHE_TTL
        value: 15
      - key: MYSQLHOST
        sync: false
      - key: MYSQLPORT
        sync: false
      - key: MYSQLDATABASE
        sync: false
      - key: MYSQLUSER
        sync: false
      - key: MYSQLPASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
